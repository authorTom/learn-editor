<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Inter for the editor UI, plus every font-pack family so theme previews
      render in the type they promise. Served from this origin rather than
      fonts.googleapis.com: no visitor IP goes to a third party, the app works
      on an internal network with no route out, and style-src can stay strict.
      Regenerate with `npm run fonts:fetch` — see scripts/fetch-fonts.mjs.

      Preloaded: Inter 400/500 are the editor's own interface, needed for the
      first paint. The rest are fetched on demand by the faces that use them.
    -->
    <link rel="preload" href="/fonts/inter-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Quoin — SCORM Course Authoring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
